<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bucking.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="index.js" defer></script>
</head>
<body>
    

<div class="booking">
  <form class="form">
    <h2>Book Appointment</h2>

    <div class="field">
      <input id="text" type="text" required>
      <label>Name</label>
    </div>

    <div class="field">
      <input id="tel" type="tel" required>
      <label>Phone</label>
    </div>

    <div class="field">
      <select required>
        <option value="" disabled selected></option>
        <option>Hair</option>
        <option>Nails</option>
        <option>Makeup</option>
      </select>
      <label>Service</label>
    </div>

    <div class="grid">
      <div class="field">
        <input id="date" type="date" required>
        <label>Date</label>
      </div>

      <div class="field">
        <input id="time" type="time" required>
        <label>Time</label>
      </div>
    </div>

        <button id="bookingBtn">Book Now</button>
   

  </form>

</div>

  
</body>
</html>
